[mod-setting-name]
RBCF_limit_radius_setting=Construction Maximum Area (Limit)
RBCF_minimum_radius_setting=Construction Minimum Area
RBCF_use_limit_when_off_setting=Use Limit When Mod is OFF
RBCF_prepare_for_uninstallation=Prepare for uninstallation

[mod-setting-description]
RBCF_limit_radius_setting=Don't worry about performance!!! The mod is highly optimized and will support even the largest construction areas with no problems!!!\n\nThis setting is for limiting the maximum construction area. If you feel like the area you are using is too big and becomes impractical in a gameplay sense, you can limit the area here, and it will not increase past the set value. If the limit is bigger than the maximum construction area your equipment setup supports, then that maximum will be used.
RBCF_minimum_radius_setting=This setting is for setting the minimum construction area.\n\nIf minimum and limit contradict each other (minimum is bigger than limit), then the minimum is the law and will be used.
RBCF_use_limit_when_off_setting=This setting only applies when the mod is toggled OFF via the shortcut (the buttons next to the item quick access bar).\n-------------------------------------------------\nSetting ON:\nConstruction area limit applies when mod is toggled off.\n-------------------------------------------------\nSetting OFF:\nThe maximum construction area of your current equipment setup is used when Mod is toggled off.
RBCF_prepare_for_uninstallation=When this is checked ON, the mod DOES NOT WORK. This setting is meant for removing any custom objects so you can uninstall this mod without losing any of your equipment. Activate it, resume the game and wait for the message and follow the instructions. If you do not want to uninstall this mod, turn this setting off and everything will work again.

[shortcut]
shortcut-toggle-robots-build-closest-first=Toggle Robots-Build-Closest-First

[controls]
input-toggle-robots-build-closest-first=Toggle ON/OFF